# CI + deployment pipeline.
#   pull request → lint, typecheck, test with coverage, PDF fixture diff (no deploy)
#   push to main → same → build → deploy to App Engine
#
# There is no staging environment, so the test job is the only thing standing
# between a branch and production. main is protected and requires it, so nothing
# reaches production without a green run on the merge result.
#
# See .github/workflows/README.md for one-time GCP setup instructions.
#
# Repository variables required (Settings → Secrets and variables → Variables):
#   WIF_PROVIDER        Workload Identity provider resource name
#   WIF_SA              Service account email for deploys
#   VITE_WCA_CLIENT_ID  WCA OAuth client ID

name: Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT: scorecards-v2-prod

on:
  # main only. A branch is covered by its PR run, so triggering on every branch push
  # would just run the same tests twice per commit. Naming a branch also keeps an
  # unfiltered `push` from firing on tag pushes.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a run only when a newer commit supersedes it, and never on main - that would
# kill a live deploy. The event stays in the key so a PR whose head branch is main
# cannot share a group with main's own push run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  id-token: write

jobs:
  # Once per commit: the pull_request run for anything under review, the push run for
  # main. The pull_request event tests the merge with main rather than the branch head,
  # which is what actually lands, is the context branch protection requires, and is the
  # only event that ever fires for a fork.
  #
  # Never gate this job behind an `if:` on the event or the head repo. A skipped job
  # still reports its check context, and branch protection counts a skip as a pass.
  #
  # The deploy job below is skipped unless the ref is main.
  test:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # pdftotext, for the printed-text checks in src/pdf/pipeline.pdf.test.ts.
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Lint
        run: npm run lint

      # `npm run build` runs this too, but as its own step it typechecks src/**
      # (test files included) and fails a PR that never reaches a build.
      - name: Typecheck
        run: npm run typecheck

      # Fails if coverage drops below the thresholds committed in
      # vitest.config.ts. Raising them is automatic (thresholds.autoUpdate).
      - name: Test
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          jq -r '.total | "| metric | % | covered / total |",
                          "|---|---|---|",
                          "| lines | \(.lines.pct)% | \(.lines.covered) / \(.lines.total) |",
                          "| statements | \(.statements.pct)% | \(.statements.covered) / \(.statements.total) |",
                          "| functions | \(.functions.pct)% | \(.functions.covered) / \(.functions.total) |",
                          "| branches | \(.branches.pct)% | \(.branches.covered) / \(.branches.total) |"' \
            coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Re-renders the fixture PDFs and pixel-diffs them against tests/pdf-baseline. The layout
  # unit tests assert measurements; this catches what they cannot see - a changed colour, a
  # shifted margin, a dropped glyph - on documents that get printed and cut.
  #
  # continue-on-error while the cross-machine tolerance proves itself: the runner's poppler
  # and font stack are not the ones a baseline was rendered on. It reports red in the run
  # without blocking a merge. Promote it to a required check (drop continue-on-error, add it
  # to `deploy.needs`) once a few PRs show it staying green - a flaky gate on the only thing
  # between a branch and production is worse than no gate.
  pdf-fixtures:
    name: PDF output regression
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # pdftoppm rasterises the PDFs; gm measures the per-page difference.
      - name: Install poppler-utils and graphicsmagick
        run: sudo apt-get update && sudo apt-get install -y poppler-utils graphicsmagick

      - name: Check fixtures against the baseline
        run: scripts/checkFixtures.sh

      # The red-highlighted diff images, so a failure can be judged rather than guessed at.
      - name: Upload diff images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-fixture-diff
          path: /tmp/fixture-check/
          retention-days: 7

  deploy:
    name: Deploy → Production
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_WCA_CLIENT_ID: ${{ vars.VITE_WCA_CLIENT_ID }}
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to App Engine
        run: ./deploy.sh

  cleanup:
    name: Cleanup old versions
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Delete old versions (keep newest 5)
        env:
          KEEP: "5"
        run: |
          all=$(gcloud app versions list \
            --project="${PROJECT}" \
            --service="default" \
            --sort-by="~version.createTime" \
            --format="value(version.id)" 2>/dev/null || true)

          [ -z "${all}" ] && echo "No versions found - skipping" && exit 0

          to_delete=$(echo "${all}" | tail -n +$((KEEP + 1)))

          [ -z "${to_delete}" ] && \
            echo "$(echo "${all}" | wc -l | tr -d ' ') version(s) - nothing to remove" && \
            exit 0

          echo "Removing: $(echo "${to_delete}" | tr '\n' ' ')"
          while IFS= read -r v; do
            gcloud app versions delete "${v}" \
              --project="${PROJECT}" \
              --service="default" \
              --quiet \
              && echo "deleted ${v}" \
              || echo "could not delete ${v} (skipping)"
          done <<< "${to_delete}"
